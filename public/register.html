<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Сорока</title>
<link rel="stylesheet" href="/css/style.css">
<script>try{if(localStorage.getItem('soroka-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<header class="site-header"><div id="site-header"></div></header>

<main class="container">
  <div class="auth-shell panel">
    <h1>Создать аккаунт</h1>
    <p>Понадобится минута — и можно оформлять заказы.</p>
    <div class="alert alert-error" id="form-error"></div>
    <form id="register-form">
      <div class="field">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
        <div class="hint">Минимум 6 символов</div>
      </div>
      <label class="consent-row">
        <input type="checkbox" id="consent" name="consent" required>
        <span>Согласен(на) на <a href="/privacy.html" target="_blank">обработку персональных данных</a></span>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>
    <p style="margin-top:16px; font-size:13.5px;">Уже есть аккаунт? <a href="/login.html" style="color:var(--teal-dark); font-weight:700;">Войти</a></p>
  </div>
</main>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('form-error');
  errEl.classList.remove('show');
  const form = e.target;
  if (!form.consent.checked) {
    errEl.textContent = 'Нужно согласие на обработку персональных данных';
    errEl.classList.add('show');
    return;
  }
  try {
    await api.post('/api/auth/register', { name: form.name.value, email: form.email.value, password: form.password.value, consent: form.consent.checked });
    const next = new URLSearchParams(location.search).get('next');
    location.href = next || '/account.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
  }
});
</script>
</body>
</html>
