<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Soroka Shop — вход</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0c0e13;
    color-scheme: dark;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  .desktop-home-view {
    width: 100%;
    height: 100vh;
    position: relative;
  }

  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100vh;
    z-index: 0;
    background: #0c0e13;
  }

  .content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 0;
    padding-bottom: 6vh;
    text-align: center;
    pointer-events: none;
  }

  .content > * {
    pointer-events: auto;
  }

  .wordmark {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(2.6rem, 7vw, 3.8rem);
    letter-spacing: 0.3px;
    margin: 0;
    color: #f5f3eb;
    text-shadow: 0 2px 24px rgba(0,0,0,.55);
    opacity: 0;
    transform: translateY(12px);
    animation: reveal .7s ease forwards .15s;
  }

  .status {
    margin: 1rem 0 0;
    font-size: 1.1rem;
    font-weight: 500;
    color: #e4e2ec;
    text-shadow: 0 1px 12px rgba(0,0,0,.45);
    opacity: 0;
    transform: translateY(10px);
    animation: reveal .7s ease forwards .3s;
  }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .gate {
    margin-top: 2.2rem;
    background: #f7f5ef;
    color: #1a1f36;
    border-radius: 14px;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow:
      0 4px 6px rgba(0,0,0,.18),
      0 22px 50px rgba(0,0,0,.4);
    opacity: 0;
    transform: translateY(14px);
    animation: reveal .7s ease forwards .45s;
    min-width: 300px;
  }

  .check {
    position: relative;
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 2px solid #b8c0d0;
    background: #fff;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .check svg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    opacity: 0;
    transform: scale(.5);
    transition: opacity .2s, transform .2s;
  }
  .check.spinning { border-color: #c98c1f; }
  .check.spinning::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    border: 2px solid #e8e4d8;
    border-top-color: #c98c1f;
    animation: spin .7s linear infinite;
  }
  .check.done {
    background: #f2b544;
    border-color: #c98c1f;
  }
  .check.done svg { opacity: 1; transform: scale(1); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gate-text { text-align: left; }
  .gate-label {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
    color: #1a1f36;
  }
  .gate-tag {
    display: inline-block;
    margin-top: 4px;
    font-size: .72rem;
    font-weight: 600;
    color: #7a5b12;
    background: #fbe6ae;
    border-radius: 5px;
    padding: 2px 7px;
  }

  .foot {
    margin-top: 1.5rem;
    font-size: .84rem;
    color: #a8b0c4;
    text-shadow: 0 1px 10px rgba(0,0,0,.4);
    opacity: 0;
    animation: reveal .7s ease forwards .6s;
  }

  @media (max-width: 480px) {
    .gate { min-width: 0; width: 88%; }
    .content { padding-bottom: 4vh; }
  }

  .page-loader {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 24px;
    height: 24px;
    margin: -12px 0 0 -12px;
    border-radius: 50%;
    border: 3px solid #e8e4d8;
    border-top-color: #8000FF;
    animation: spin .7s linear infinite;
    z-index: 5;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .page-loader.is-hidden {
    opacity: 0;
  }
</style>

<script>
  // Тема капчи зависит от времени суток у посетителя: светлая с 9:00 до 17:00,
  // тёмная с 17:00 до 9:00. three_scene.js спрашивает про это через
  // matchMedia('(prefers-color-scheme: dark)') — подменяем ответ на основе часов,
  // а не системной темы устройства.
  const hour = new Date().getHours();
  const isNightTime = hour >= 17 || hour < 9;

  const originalMatchMedia = window.matchMedia;
  window.matchMedia = function(query) {
    if (typeof query === 'string' && query.includes('prefers-color-scheme: dark')) {
      return {
        matches: isNightTime,
        media: query,
        addListener: function(){},
        removeListener: function(){},
        addEventListener: function(){},
        removeEventListener: function(){},
        dispatchEvent: function(){ return false; }
      };
    }
    return originalMatchMedia.call(window, query);
  };
</script>
</head>
<body>

<div id="application">
  <div class="desktop-home-view">
    <div class="content">
      <h1 class="wordmark">Soroka Shop</h1>
      <p class="status" id="statusText">Готовим витрину — ещё пара секунд...</p>

      <div class="gate">
        <div class="check" id="check" role="checkbox" aria-checked="false" tabindex="0">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 12.5L9.5 18L20 6" stroke="#5a4210" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="gate-text">
          <div class="gate-label" id="gateLabel">Нажмите, чтобы продолжить</div>
          <span class="gate-tag">demo</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="pageLoader" class="page-loader"></div>

<script src="/js/three_scene.js"></script>

<script>
  const check = document.getElementById('check');
  const gateLabel = document.getElementById('gateLabel');
  const statusText = document.getElementById('statusText');
  let settled = false;

  function runCheck() {
    if (settled) return;
    check.classList.add('spinning');
    gateLabel.textContent = 'Проверяем...';
    setTimeout(() => {
      settled = true;
      check.classList.remove('spinning');
      check.classList.add('done');
      check.setAttribute('aria-checked', 'true');
      gateLabel.textContent = 'Готово, переходим в магазин...';
      statusText.textContent = 'Всё готово';
      const next = new URLSearchParams(location.search).get('next') || '/';
      setTimeout(() => { window.location.href = next; }, 900);
    }, 1200);
  }

  check.addEventListener('click', runCheck);
  check.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      runCheck();
    }
  });

  setTimeout(runCheck, 9500);

  const pageLoader = document.getElementById('pageLoader');
  if (pageLoader) {
    const hideLoader = () => {
      pageLoader.classList.add('is-hidden');
      setTimeout(() => pageLoader.remove(), 300);
    };
    if (document.readyState === 'complete') {
      hideLoader();
    } else {
      window.addEventListener('load', hideLoader);
    }
  }
</script>

</body>
</html>
